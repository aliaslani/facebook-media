{% extends 'core/base.html' %}
{% load crispy_forms_tags %}
{% block title %}
       {% if form.instance.pk %}Edit Post{% else %}New Post{% endif %}
       {% endblock %}

{% block main %}
    <form action="{% if form.instance.pk %}{% url 'update_post' form.instance.pk %}{% else %}{% url 'new_post' %}{% endif %}" method="post">
        {% csrf_token %}
        {% crispy form %}
        <div class="mt-3 d-grid">
            <input type='submit' value='{% if form.instance.pk %}Update Post{% else %}Create Post{% endif %}' class='btn btn-primary'>
        </div>
    </form>
{% endblock %}
