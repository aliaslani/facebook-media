{% extends 'core/base.html' %}

{% block title %}
    Home
{% endblock %}


{% block main %}

<div class="row d-flex justify-content-between">
    <div class="col-sm-6">
        <div class="card">
            <div class="card-header">
                {{ post.title}}
            </div>
            <div class="card-body">
                <p>
                    {{ post.content }}
                </p>
                <small>{{ post.created_at }} </small>  <small> {{ post.user }}</small>
            </div>
        </div>

    </div>
</div>
{% endblock %}
