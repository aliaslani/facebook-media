{% extends 'core/base.html' %}
{% load crispy_forms_tags %}
{% block title %}
    New Post

{% endblock %}


{% block main %}
    <form action="{% url 'new_post' %}" method="post">

        {% csrf_token %}

        {% crispy form %}
        <div class="mt-3 d-grid">

            <input type='submit' value='Create Post' class='btn btn-primary'>
        </div>
    </form>
{% endblock %}
