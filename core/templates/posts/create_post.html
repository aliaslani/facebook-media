{% extends "core/base.html" %}

{% block main %}

<div class="container mt-4">

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm">
                <div class="card-header">
                    <h4>Create Post</h4>
                </div>

                <div class="card-body">

                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save
                        </button>

                        <a
                            href="{% url 'post-list' %}"
                            class="btn btn-secondary"
                        >
                            Cancel
                        </a>
                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

{% endblock %}
