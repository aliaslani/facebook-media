<nav>
    <ul class="pagination">

        {% if page_obj.has_previous %}
        <li class="page-item">
            <a class="page-link"
               hx-get="?page={{ page_obj.previous_page_number }}"
               hx-target="#table">
                Prev
            </a>
        </li>
        {% endif %}

        <li class="page-item active">
            <span class="page-link">
                {{ page_obj.number }}
            </span>
        </li>

        {% if page_obj.has_next %}
        <li class="page-item">
            <a class="page-link"
               hx-get="?page={{ page_obj.next_page_number }}"
               hx-target="#table">
                Next
            </a>
        </li>
        {% endif %}

    </ul>
</nav>
